"""
Example django-pbac policies for the document management demo.

These policies are loaded by YAMLPolicyLoader from the example/policies/ directory.
"""
policies:
  # Viewers can read public and internal documents
  - id: example:viewer-read-documents
    effect: PERMIT
    actions:
      - "documents:read"
    subject_matchers:
      - roles:
          - viewer
    resource_matchers:
      - type: document
    conditions: []
    priority: 10
    enabled: true

  # Editors can read and edit documents
  - id: example:editor-read-write-documents
    effect: PERMIT
    actions:
      - "documents:read"
      - "documents:edit"
    subject_matchers:
      - roles:
          - editor
    resource_matchers:
      - type: document
    conditions: []
    priority: 20
    enabled: true

  # Document owners can delete their own documents
  - id: example:owner-delete
    effect: PERMIT
    actions:
      - "documents:delete"
    subject_matchers:
      - attributes:
          {}
    resource_matchers:
      - type: document
        attributes:
          owner:
            ref: "subject.id"
    conditions: []
    priority: 50
    enabled: true

  # Nobody can read confidential docs unless they are the owner
  - id: example:deny-confidential-non-owner
    effect: DENY
    actions:
      - "documents:read"
    subject_matchers:
      - {}  # Any subject
    resource_matchers:
      - type: document
        attributes:
          classification: confidential
    conditions:
      # Only deny if the subject is NOT the owner
      - attribute: resource.attributes.owner
        operator: neq
        value:
          ref: "subject.id"
    priority: 100
    enabled: true
